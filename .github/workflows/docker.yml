name: Docker Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_AUTH_URL=${{ vars.VITE_AUTH_URL }}
            VITE_BACKEND_UPLOAD_URL=${{ vars.VITE_BACKEND_UPLOAD_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_REQUEST_HANDLER_DOMAIN=${{ vars.VITE_REQUEST_HANDLER_DOMAIN }}
            VITE_REQUEST_HANDLER_PROTOCOL=${{ vars.VITE_REQUEST_HANDLER_PROTOCOL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wercel-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/wercel-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
